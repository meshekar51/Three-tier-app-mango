<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>&gt; task_board</h1>
    <p id="status" class="status">checking backend...</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="new task..." required maxlength="200">
      <button type="submit">add</button>
    </form>

    <ul id="task-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
