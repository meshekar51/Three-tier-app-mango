# postgresql.conf — minimal config for a small container.
# Copy to /etc/postgresql/postgresql.conf and start with:
#   postgres -c config_file=/etc/postgresql/postgresql.conf

listen_addresses = '*'          # accept connections from other containers
port = 5432
max_connections = 50

shared_buffers = 128MB
work_mem = 4MB

# Log to stdout so `docker logs` shows it
logging_collector = off
log_destination = 'stderr'
log_connections = on
log_disconnections = on
log_min_duration_statement = 500   # log queries slower than 500 ms

timezone = 'UTC'
log_timezone = 'UTC'
